<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waiver Radar 2</title>
<meta name="description" content="Tko igra koji dan, koga baciti, koga uzeti i kada: ESPN fantasy NBA.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#182028">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Radar 2">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout from v1: sticky header (brand + league chips + tab strip), one scrolling column of dense cards. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E3E8ED; --fg:#141A22; --muted:#5B6673; --line:#D3DAE1;
  --accent:#D9480F; --accent-ink:#FFFFFF;
  --out:#C62828; --out-bg:#FBE4E4; --gtd:#A86B00; --gtd-bg:#FBEFD2; --ok:#2E7D32; --ok-bg:#DEF2E0; --info:#1E5AA8; --info-bg:#DCE8F8;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1418; --surface:#182028; --surface-2:#222C36; --fg:#E8ECF0; --muted:#93A0AC; --line:#2C3843;
  --accent:#FF7A33; --accent-ink:#1A0D06;
  --out:#FF6B6B; --out-bg:#3A1C1C; --gtd:#F2C14E; --gtd-bg:#3A2F12; --ok:#5DD39E; --ok-bg:#163326; --info:#7FB2F0; --info-bg:#172A42;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1418; --surface:#182028; --surface-2:#222C36; --fg:#E8ECF0; --muted:#93A0AC; --line:#2C3843;
  --accent:#FF7A33; --accent-ink:#1A0D06;
  --out:#FF6B6B; --out-bg:#3A1C1C; --gtd:#F2C14E; --gtd-bg:#3A2F12; --ok:#5DD39E; --ok-bg:#163326; --info:#7FB2F0; --info-bg:#172A42;
  color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--info)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-inner{padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.brand h1{font-size:28px;font-weight:700;text-transform:uppercase;line-height:1}
.brand h1 em{font-style:normal;color:var(--accent)}
.stamp{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.live{background:var(--ok)}.dot.stale{background:var(--gtd)}.dot.off{background:var(--out)}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:12px;border-radius:999px;padding:2px 9px;cursor:pointer;line-height:1.5}
.iconbtn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--body);font-size:11px;background:var(--surface-2);color:var(--fg);border-radius:10px;padding:1px 6px;margin-left:5px;vertical-align:middle}
.tab .cnt.warn{background:var(--out-bg);color:var(--out)}

main{padding:14px max(16px,env(safe-area-inset-right,0px)) max(48px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.grid.two{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card.hot{border-left:4px solid var(--accent)}
.card.warnc{border-left:4px solid var(--out)}
.row{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.name{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.1}
.team{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.06em;background:var(--surface-2);color:var(--fg);padding:2px 7px;border-radius:4px}
.pos{font-size:12px;color:var(--muted);letter-spacing:.04em}
.pill{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.out{background:var(--out-bg);color:var(--out)}
.pill.gtd{background:var(--gtd-bg);color:var(--gtd)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.hot{background:var(--accent);color:var(--accent-ink)}
.meta{font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
.kv div{background:var(--surface-2);border-radius:6px;padding:5px 8px;min-width:0}
.kv dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv dd{margin:0;font-family:var(--display);font-size:18px;font-weight:600}
.kv dd small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.why{margin:8px 0 0;font-size:14px}
.why li{margin:2px 0}
ul.plain{list-style:none;margin:8px 0 0;padding:0}
ul.plain li{padding:6px 0;border-top:1px solid var(--line);font-size:14.5px}
ul.plain li:first-child{border-top:0}

.league{margin-bottom:18px}
.league > h2{font-size:22px;margin-bottom:8px;display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.league > h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;align-items:center;text-align:center}
.score .side{min-width:0}
.score .tn{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pts{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.score .vs{font-family:var(--display);color:var(--muted);font-size:18px}
.score .proj{font-size:13px;color:var(--muted)}
.score .proj b{font-family:var(--display);font-size:18px;color:var(--fg)}
.verdict{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;margin-top:6px}
.verdict.win{color:var(--ok)}.verdict.lose{color:var(--out)}
.counts{display:flex;gap:8px;margin-top:10px}
.counts div{flex:1;background:var(--surface-2);border-radius:6px;padding:6px 8px;text-align:center}
.counts dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.counts dd{margin:0;font-family:var(--display);font-size:20px;font-weight:700}
.alert{padding:7px 10px;border-radius:6px;background:var(--out-bg);color:var(--fg);font-size:14px;margin-top:6px}
.alert.tip{background:var(--info-bg)}
.alert.mode{background:var(--gtd-bg)}
.step{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.when{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.05em;color:var(--accent);white-space:nowrap;padding-top:2px}
.step .txt{font-size:14.5px;min-width:0}
.gain{font-family:var(--display);font-weight:700;color:var(--ok)}

.days{display:grid;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.day.today{border-color:var(--info);box-shadow:0 0 0 1px var(--info)}
.day.past{opacity:.78}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:7px 12px;background:var(--surface-2);font-family:var(--display);font-size:17px;font-weight:600;gap:8px}
.day-head .meta{font-family:var(--body);font-weight:400}
.day-body{display:grid;grid-template-columns:1fr 1fr}
.day-body > div{padding:8px 12px;min-width:0}
.day-body > div + div{border-left:1px solid var(--line)}
.cntbig{font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.cntbig small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.cntbig.more{color:var(--ok)}.cntbig.less{color:var(--out)}
.names{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.names .dtd{color:var(--gtd)}
.names .extra{color:var(--out)}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-family:var(--display);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
td:first-child,th:first-child{text-align:left;white-space:normal}
td.n{font-family:var(--display);font-size:17px;font-weight:600}
td .sub{display:block;font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400}
tr.zero td{background:color-mix(in srgb,var(--out-bg) 45%,transparent)}

.news{margin-top:8px;font-size:13.5px}
.news p{margin:6px 0 0}
.news time{color:var(--muted);font-size:12px;margin-right:6px}
.news .sum{display:block;color:var(--fg)}
.news .en{color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:20px 16px;color:var(--muted)}
.empty strong{color:var(--fg)}
.foot{margin-top:28px;font-size:12px;color:var(--muted);line-height:1.6}
.prob{display:flex;align-items:baseline;justify-content:center;gap:4px 10px;flex-wrap:wrap;margin-top:8px}
.prob .big{font-family:var(--display);font-size:30px;font-weight:700;line-height:1}
.prob .big.good{color:var(--ok)}.prob .big.bad{color:var(--out)}
.prob .lab{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar > span{display:block;height:100%;background:var(--ok)}
.up{color:var(--ok);font-weight:700}.down{color:var(--out);font-weight:700}
.alarm{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.alarm:first-child{border-top:0}
.alarm time{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.alarm .txt{white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.alarm.muted .txt{color:var(--muted)}
td.pos{color:var(--ok)}td.neg{color:var(--out)}
th.on{color:var(--accent)}
.rk{display:inline-block;min-width:1.7em;color:var(--muted);font-family:var(--display);font-weight:600}
.warn{color:var(--gtd)}
pre.report{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin:10px 0 6px}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="brand">
    <h1>Waiver <em>Radar</em> 2</h1>
    <div class="stamp"><span class="dot" id="dot"></span><span id="stamp">Učitavam podatke…</span><button class="iconbtn" id="themebtn" type="button" aria-label="Promijeni temu">Tema: auto</button></div>
  </div>
  <div class="tabs" role="tablist" aria-label="Sekcije">
    <button class="tab" role="tab" id="t-pregled" aria-controls="p-pregled" data-tab="pregled">Pregled<span class="cnt num" id="c-pregled" hidden></span></button>
    <button class="tab" role="tab" id="t-moji" aria-controls="p-moji" data-tab="moji">Moji igrači</button>
    <button class="tab" role="tab" id="t-raspored" aria-controls="p-raspored" data-tab="raspored">Raspored</button>
    <button class="tab" role="tab" id="t-baci" aria-controls="p-baci" data-tab="baci">Za bacanje</button>
    <button class="tab" role="tab" id="t-uzmi" aria-controls="p-uzmi" data-tab="uzmi">Za uzeti<span class="cnt num" id="c-uzmi" hidden></span></button>
    <button class="tab" role="tab" id="t-plan" aria-controls="p-plan" data-tab="plan">Plan</button>
    <button class="tab" role="tab" id="t-ozljede" aria-controls="p-ozljede" data-tab="ozljede">Ozljede/vijesti</button>
    <button class="tab" role="tab" id="t-alarmi" aria-controls="p-alarmi" data-tab="alarmi">Alarmi<span class="cnt num" id="c-alarmi" hidden></span></button>
    <button class="tab" role="tab" id="t-povijest" aria-controls="p-povijest" data-tab="povijest">Povijest</button>
  </div>
</div></header>

<main>
  <div class="chips" id="league-chips" aria-label="Liga" hidden></div>

  <section role="tabpanel" id="p-pregled" aria-labelledby="t-pregled"></section>
  <section role="tabpanel" id="p-moji" aria-labelledby="t-moji" hidden>
    <div class="chips" id="moji-chips" aria-label="Poredaj po">
      <button class="chip" type="button" aria-pressed="true" data-v="avg">Prosjek</button>
      <button class="chip" type="button" aria-pressed="false" data-v="last7">Zadnjih 7 dana</button>
      <button class="chip" type="button" aria-pressed="false" data-v="now">Sada</button>
      <button class="chip" type="button" aria-pressed="false" data-v="long">Dugoročno</button>
    </div>
    <div id="moji-body"></div>
  </section>
  <section role="tabpanel" id="p-raspored" aria-labelledby="t-raspored" hidden></section>
  <section role="tabpanel" id="p-baci" aria-labelledby="t-baci" hidden>
    <div class="chips" id="baci-chips">
      <button class="chip" type="button" aria-pressed="true" data-v="tjedan">Ovaj tjedan</button>
      <button class="chip" type="button" aria-pressed="false" data-v="dugo">Dugoročno</button>
    </div>
    <div id="baci-body"></div>
  </section>
  <section role="tabpanel" id="p-uzmi" aria-labelledby="t-uzmi" hidden>
    <div class="chips" id="uzmi-chips">
      <button class="chip" type="button" aria-pressed="true" data-v="tjedan">Ovaj tjedan</button>
      <button class="chip" type="button" aria-pressed="false" data-v="dugo">Dugoročno</button>
    </div>
    <div id="uzmi-body"></div>
  </section>
  <section role="tabpanel" id="p-plan" aria-labelledby="t-plan" hidden></section>
  <section role="tabpanel" id="p-ozljede" aria-labelledby="t-ozljede" hidden></section>
  <section role="tabpanel" id="p-alarmi" aria-labelledby="t-alarmi" hidden></section>
  <section role="tabpanel" id="p-povijest" aria-labelledby="t-povijest" hidden></section>

  <p class="foot" id="foot">Podaci: ESPN Fantasy (rosteri, rezultat, raspored, vijesti). Radar na PC-u provjerava svakih 10–15 min i šalje alarme na Telegram; izvještaj u 08:30 i 21:30. Aplikacija samo predlaže, izmjene radiš sam na ESPN-u.</p>
</main>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safe=fn=>{try{return fn();}catch(e){return null;}};
  const f1=x=>x==null?"—":(+x).toFixed(1);
  const f0=x=>x==null?"—":Math.round(+x);
  const sgn=x=>x==null?"":(x>0?"+":x<0?"−":"±")+Math.abs(x).toFixed(Math.abs(x)<10?1:0);
  const plural=(n,one,few,many)=>n%10===1&&n%100!==11?one:n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?few:many;
  const ago=iso=>{const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));if(m<1)return"upravo";if(m<60)return`prije ${m} min`;const h=Math.floor(m/60);if(h<24)return`prije ${h} h`;const d=Math.floor(h/24);return`prije ${d} ${d===1?"dan":"dana"}`;};
  const fmtDate=iso=>{try{const d=new Date(iso);return d.toLocaleString("hr-HR",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"});}catch(e){return iso;}};

  const TABS=["pregled","moji","raspored","baci","uzmi","plan","ozljede","alarmi","povijest"];
  const pct=x=>x==null?"—":Math.round(x*100)+" %";
  const trendHtml=p=>p.trend==="↑"?`<span class="up" title="minute zadnjih 3/5 utakmica iznad prosjeka sezone (${sgn(p.trend_delta)})">↑</span>`:p.trend==="↓"?`<span class="down" title="minute ispod prosjeka sezone (${sgn(p.trend_delta)})">↓</span>`:"";
  const S={data:null,tab:"pregled",league:null,moji:"avg",baci:"tjedan",uzmi:"tjedan",theme:"auto"};
  S.tab=safe(()=>localStorage.getItem("wr2.tab"))||S.tab;
  S.league=safe(()=>localStorage.getItem("wr2.league"));
  S.theme=safe(()=>localStorage.getItem("wr2.theme"))||"auto";

  // ---------- theme
  function applyTheme(){
    const root=document.documentElement;
    if(S.theme==="auto")delete root.dataset.theme;else root.dataset.theme=S.theme;
    $("themebtn").textContent="Tema: "+({auto:"auto",light:"svijetla",dark:"tamna"}[S.theme]);
    const dark=S.theme==="dark"||(S.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
    document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.content=dark?"#182028":"#FFFFFF";});
  }
  $("themebtn").addEventListener("click",()=>{S.theme={auto:"light",light:"dark",dark:"auto"}[S.theme];safe(()=>localStorage.setItem("wr2.theme",S.theme));applyTheme();});
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
  applyTheme();

  // ---------- helpers
  const leagues=()=>(S.data&&S.data.leagues)||[];
  const cur=()=>leagues().find(L=>L.key===S.league)||leagues()[0]||null;
  function inj(p){
    if(!p.injury)return"";
    const cls=p.injury==="DTD"?"gtd":"out";
    return `<span class="pill ${cls}">${esc(p.injury)}${p.out?" · "+esc(p.out):""}</span>`;
  }
  const hotPill=p=>p.hot?`<span class="pill hot" title="Novi starter / rast minuta">🔥</span>`:"";
  const head=(p,extra="")=>`<div class="row"><span class="name">${esc(p.name)}</span><span class="team">${esc(p.team)}</span><span class="pos">${esc(p.pos)}</span>${hotPill(p)}${inj(p)}${extra}</div>`;
  const reasons=p=>(p.signals||[]).map(s=>`<li>🔥 ${esc(s.text)}${s.detail?` <span class="meta">— ${esc(s.detail)}</span>`:""}</li>`).join("")+(p.last?`<li class="meta">zadnja (${esc(p.last.date)}): ${esc(p.last.line)}, ${f1(p.last.fpts)} FP</li>`:"");
  const days=p=>(p.days&&p.days.length)?p.days.join(", "):"ne igra";
  function alertCls(a){return a.startsWith("💡")?"alert tip":"alert";}

  // ---------- Pregled: both leagues
  function renderPregled(){
    const el=$("p-pregled");
    const Ls=leagues();
    if(!S.data){el.innerHTML=`<div class="empty">Podaci se učitavaju…</div>`;return;}
    let warn=0;
    let html=Ls.map(L=>{
      warn+=(L.alerts||[]).filter(a=>a.startsWith("⚠️")).length;
      const s=L.score,win=s.proj_me>s.proj_opp;
      const today=(L.days||[]).find(d=>d.today);
      const tmr=today?(L.days||[]).find(d=>d.sp===today.sp+1):null;
      const cnt=(d,lab)=>d?`<div><dt>${lab}</dt><dd class="num">${d.past||!d.me?"gotovo":`${d.me.n} : ${d.opp?d.opp.n:0}`}</dd></div>`:"";
      const hot=(L.pick_week||[]).filter(p=>p.hot).slice(0,3);
      const stale=L.stale?` · <span class="warn">stari podaci: ${esc(L.error||"")}</span>`:"";
      return `<div class="league"><h2>${esc(L.label)}<small>${esc(L.name)} · tjedan ${L.period} (${esc(L.week)})${stale}</small></h2>
        <div class="card">
          <div class="score">
            <div class="side"><div class="tn">${esc(L.me.name)}</div><div class="pts num">${f0(s.me)}</div></div>
            <div class="vs">:</div>
            <div class="side"><div class="tn">${esc(L.opp?L.opp.name:"—")}</div><div class="pts num">${f0(s.opp)}</div></div>
            <div class="proj">proj. <b class="num">${f0(s.proj_me)}</b></div><div></div><div class="proj">proj. <b class="num">${f0(s.proj_opp)}</b></div>
          </div>
          <div class="verdict ${win?"win":"lose"}">${win?"✅ vodiš u projekciji":"❌ gubiš u projekciji"} (${sgn(s.proj_me-s.proj_opp)})</div>
          ${L.win_prob!=null?`<div class="prob"><span class="lab">Šansa za pobjedu</span><span class="big num ${L.win_prob>=.5?"good":"bad"}">${pct(L.win_prob)}</span>${L.win_prob_plan!=null?`<span class="meta">s planom <b class="num">${pct(L.win_prob_plan)}</b></span>`:""}</div><div class="bar" aria-hidden="true"><span style="width:${Math.round(L.win_prob*100)}%"></span></div>`:""}
          <dl class="counts">${cnt(today,"Danas ti : oni")}${cnt(tmr,"Sutra ti : oni")}<div><dt>Preuzimanja</dt><dd class="num">${L.adds.used}/${L.adds.limit}${L.adds.opp_used!=null&&L.opp?` <small class="meta">· opp ${L.adds.opp_used}</small>`:""}</dd></div></dl>
          ${L.prob_hint?`<div class="alert tip">💡 ${esc(L.prob_hint)}</div>`:""}
          ${L.mode_reason?`<div class="alert mode">📉 ${esc(L.mode_reason)}</div>`:""}
          ${(L.opp_moves||[]).length?`<p class="meta" style="margin:8px 0 0">Protivnik ovaj tjedan: ${L.opp_moves.map(m=>esc([(m.day||""),m.adds.length?"+"+m.adds.join(", "):"",m.drops.length?"−"+m.drops.join(", "):""].filter(Boolean).join(" "))).join(" · ")}</p>`:""}
          ${(L.alerts||[]).map(a=>`<div class="${alertCls(a)}">${esc(a)}</div>`).join("")}
          ${hot.length?`<ul class="plain">${hot.map(p=>`<li>🔥 <b>${esc(p.name)}</b> (${esc(p.team)}${p.status==="WAIVER"?", waiver do "+esc(p.waiver_until):""}) — ${esc((p.signals||[]).map(s=>s.text).join(", "))}${p.last?`, zadnja: ${esc(p.last.line)}`:""}</li>`).join("")}</ul>`:""}
          ${(L.plan||[]).length?`<div style="margin-top:8px">${L.plan.map(stepHtml).join("")}</div>`:`<p class="meta" style="margin:10px 0 0">Plan: nema izmjene koja se isplati.</p>`}
        </div></div>`;
    }).join("");
    html+=(S.data.errors||[]).filter(e=>!Ls.some(L=>L.key===e.key)).map(e=>`<div class="league"><h2>${esc(e.label)}</h2><div class="card warnc">⚠️ ${esc(e.message)}</div></div>`).join("");
    html+=S.data.report?`<details><summary>Tekst izvještaja (Telegram)</summary><pre class="report">${esc(S.data.report)}</pre></details>`:"";
    el.innerHTML=html||`<div class="empty">Nema podataka.</div>`;
    const c=$("c-pregled");c.hidden=!warn;c.textContent=warn;c.classList.toggle("warn",!!warn);
  }
  function stepHtml(m){
    const t=m.body!=null?m.body:m.text.replace(/^[^:]+:\s*/,"");
    return `<div class="step"><span class="when">${esc(m.when)}</span><span class="txt">${esc(t)}</span></div>`;

  // ---------- Plan
  function renderPlan(){
    const el=$("p-plan");

      const groups=[];
      (L.plan||[]).forEach(m=>{let g=groups.find(x=>x.when===m.when);if(!g){g={when:m.when,items:[]};groups.push(g);}g.items.push(m);});
      return `<div class="league"><h2>${esc(L.label)}<small>preuzimanja ${L.adds.used}/${L.adds.limit} · način: ${L.mode==="dugorocno"?"dugoročno":"ovaj tjedan"}</small></h2>
        <div class="card">${L.mode_reason?`<div class="alert mode" style="margin:0 0 8px">📉 ${esc(L.mode_reason)}</div>`:""}
        ${groups.length?groups.map(g=>`<h3 style="font-size:18px;margin:6px 0 2px;color:var(--accent)">${esc(g.when)}</h3><ul class="plain">${g.items.map(m=>`<li>${esc(m.body!=null?m.body:m.text.replace(/^[^:]+:\s*/,""))}</li>`).join("")}</ul>`).join("")
          :`<p class="meta" style="margin:0">Nema izmjene koja se isplati${L.adds.used>=L.adds.limit?" (iskorištena sva preuzimanja)":""}.</p>`}
        ${(L.infos||[]).length?`<p class="meta" style="margin:10px 0 0">${(L.infos||[]).map(esc).join(" · ")}</p>`:""}</div></div>`;
    }).join("")+`<p class="meta">DANAS = slobodnog igrača uzmi odmah (bačeni gubi današnju utakmicu ako je još nije odigrao). SUTRA/DAN UJUTRO = napravi to jutro, bačeni još igra do tada. Claim prolazi u vrijeme obrade waivera; bačeni igra do tada. Jedno preuzimanje se čuva za ozljede do subote.</p>`;
  }

  function showTab(name,focus){
    if(!TABS.includes(name))name="pregled";
    S.tab=name;
    document.querySelectorAll(".tab").forEach(b=>{const on=b.dataset.tab===name;b.setAttribute("aria-selected",String(on));b.tabIndex=on?0:-1;if(on&&focus)b.focus();if(on)safe(()=>b.scrollIntoView({block:"nearest",inline:"nearest"}));});
    TABS.forEach(n=>{$("p-"+n).hidden=n!==name;});
    safe(()=>localStorage.setItem("wr2.tab",name));
    renderChips();
  }
  const tabBtns=[...document.querySelectorAll(".tab")];
  tabBtns.forEach((b,i)=>{
    b.addEventListener("click",()=>showTab(b.dataset.tab));
    b.addEventListener("keydown",e=>{
      const k={ArrowRight:1,ArrowLeft:-1}[e.key];
      if(k){e.preventDefault();showTab(tabBtns[(i+k+tabBtns.length)%tabBtns.length].dataset.tab,true);}
      else if(e.key==="Home"){e.preventDefault();showTab(tabBtns[0].dataset.tab,true);}
      else if(e.key==="End"){e.preventDefault();showTab(tabBtns[tabBtns.length-1].dataset.tab,true);}
    });
  });
  $("league-chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;S.league=b.dataset.league;safe(()=>localStorage.setItem("wr2.league",S.league));renderAll();});
  function chipGroup(id,key,render){$(id).addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;S[key]=b.dataset.v;$(id).querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));render();});}

  chipGroup("uzmi-chips","uzmi",renderUzmi);
  showTab((location.hash||"").slice(1)||S.tab);
  renderAll();

  // ---------- data: the PC publishes every 10-15 min to the `podaci` branch; GitHub Pages has the fallback copy.
  // Whichever is newer wins.
  function remoteUrl(){
    const h=location.hostname,seg=location.pathname.split("/").filter(Boolean)[0];
    const owner=h.endsWith(".github.io")?h.split(".")[0]:"arminsahic260-del";
    const repo=h.endsWith(".github.io")&&seg?seg:"waiver-radar";
    return `https://raw.githubusercontent.com/${owner}/${repo}/podaci/radar.json`;
  }
  const getJson=url=>fetch(url,{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
  let loading=null;
  function load(){
    if(loading)return loading;
    loading=Promise.allSettled([getJson("data/radar.json"),getJson(remoteUrl())]).then(rs=>{
      const ds=rs.filter(r=>r.status==="fulfilled"&&r.value&&r.value.generated).map(r=>r.value);
      if(!ds.length)throw new Error("nema podataka");
      ds.sort((a,b)=>new Date(b.generated)-new Date(a.generated));
      S.data=ds[0];renderAll();
    })
      .catch(e=>{console.warn("radar.json",e);if(!S.data)$("stamp").textContent="Podaci nisu dostupni (offline?)";})
      .finally(()=>{loading=null;});
    return loading;
  }
  load();
  setInterval(renderStamp,60e3);
  setInterval(()=>{if(!document.hidden)load();},5*60e3);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
  addEventListener("online",()=>{renderStamp();load();});
  addEventListener("offline",renderStamp);
  if("serviceWorker" in navigator){
    let t=null;
    navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="data-updated"){clearTimeout(t);t=setTimeout(load,400);}});
    addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW",e));});
  }
})();
</script>
</body>
</html>
